name: PCOS boot test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install build and emulator tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib grub-pc-bin grub-common xorriso qemu-system-x86 mtools
      - name: Compile and validate
        run: make clean && make check && make iso
      - name: Headless safe-boot smoke test
        run: |
          rm -f build/qemu-debug.log
          timeout 15s qemu-system-i386 \
            -m 16M \
            -drive file=data/pcos-data.img,format=raw,if=ide,index=0 \
            -cdrom build/pcos-0.4.iso -boot d \
            -display none -serial none -monitor none \
            -no-reboot -no-shutdown \
            -debugcon file:build/qemu-debug.log \
            -global isa-debugcon.iobase=0xe9 || true
          cat build/qemu-debug.log
          grep -q "PCOS: UI ONLINE" build/qemu-debug.log
          grep -q "PCOS: entering event loop" build/qemu-debug.log
      - name: Headless full-driver boot test
        run: |
          sed -i 's/set default=0/set default=1/' iso/boot/grub/grub.cfg
          make iso
          rm -f build/qemu-full-debug.log
          timeout 20s qemu-system-i386 \
            -m 32M \
            -drive file=data/pcos-data.img,format=raw,if=ide,index=0 \
            -cdrom build/pcos-0.4.iso -boot d \
            -nic user,model=rtl8139 -device sb16 \
            -display none -serial none -monitor none \
            -no-reboot -no-shutdown \
            -debugcon file:build/qemu-full-debug.log \
            -global isa-debugcon.iobase=0xe9 || true
          cat build/qemu-full-debug.log
          grep -q "PCOS: ATA init done" build/qemu-full-debug.log
          grep -q "PCOS: mouse init done" build/qemu-full-debug.log
          grep -q "PCOS: network init done" build/qemu-full-debug.log
          grep -q "PCOS: audio init done" build/qemu-full-debug.log
          grep -q "PCOS: entering event loop" build/qemu-full-debug.log
