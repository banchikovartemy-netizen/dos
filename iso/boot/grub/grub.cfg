set timeout=6
set default=0

menuentry "PCOS 0.5 SAFE TEXT / MOST COMPATIBLE [DEFAULT]" {
    terminal_output console
    multiboot /boot/pcos.elf safe
    module /boot/pcfs.tar pcfs
    boot
}

menuentry "PCOS 0.5 SAFE GRAPHICS / 800x600" {
    insmod all_video
    insmod gfxterm
    terminal_output gfxterm
    set gfxmode=800x600x32,640x480x32,auto
    set gfxpayload=keep
    multiboot /boot/pcos.elf safe
    module /boot/pcfs.tar pcfs
    boot
}

menuentry "PCOS 0.5 FULL DRIVERS / TEXT" {
    terminal_output console
    multiboot /boot/pcos.elf full
    module /boot/pcfs.tar pcfs
    boot
}

