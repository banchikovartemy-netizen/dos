set timeout=8
set default=0
insmod all_video
insmod gfxterm
terminal_output gfxterm

menuentry "PCOS 0.4 SAFE / 800x600 [DEFAULT]" {
    set gfxmode=800x600x32,640x480x32,auto
    set gfxpayload=keep
    multiboot /boot/pcos.elf safe
    module /boot/pcfs.tar pcfs
    boot
}
menuentry "PCOS 0.4 FULL DRIVERS / 800x600" {
    set gfxmode=800x600x32,640x480x32,auto
    set gfxpayload=keep
    multiboot /boot/pcos.elf full
    module /boot/pcfs.tar pcfs
    boot
}
menuentry "PCOS 0.4 SAFE / 1024x768" {
    set gfxmode=1024x768x32,800x600x32,auto
