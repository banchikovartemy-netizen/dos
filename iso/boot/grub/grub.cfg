set timeout=4
set default=0
insmod all_video
insmod gfxterm
terminal_output gfxterm

menuentry "PCOS 0.3 AUTO / BEST AVAILABLE" {
    set gfxmode=2560x1440x32,1920x1080x32,1600x900x32,1280x720x32,1024x768x32,800x600x32,640x480x32,auto
    set gfxpayload=keep
    multiboot /boot/pcos.elf
    module /boot/pcfs.tar pcfs
    boot
}
menuentry "PCOS 0.3 LOW / 800x600" {
    set gfxmode=800x600x32,640x480x32,auto
    set gfxpayload=keep
    multiboot /boot/pcos.elf
    module /boot/pcfs.tar pcfs
    boot
}
menuentry "PCOS 0.3 1024x768" {
    set gfxmode=1024x768x32,800x600x32,auto
    set gfxpayload=keep
    multiboot /boot/pcos.elf
    module /boot/pcfs.tar pcfs
    boot
}
menuentry "PCOS 0.3 HD / 1280x720" {
    set gfxmode=1280x720x32,1024x768x32,auto
    set gfxpayload=keep
    multiboot /boot/pcos.elf
    module /boot/pcfs.tar pcfs
    boot
}
menuentry "PCOS 0.3 FULL HD / 1920x1080" {
    set gfxmode=1920x1080x32,1280x720x32,auto
    set gfxpayload=keep
    multiboot /boot/pcos.elf
    module /boot/pcfs.tar pcfs
    boot
}
menuentry "PCOS 0.3 2K / 2560x1440" {
    set gfxmode=2560x1440x32,1920x1080x32,auto
    set gfxpayload=keep
    multiboot /boot/pcos.elf
    module /boot/pcfs.tar pcfs
    boot
}
menuentry "PCOS 0.3 VGA TEXT FALLBACK" {
    terminal_output console
    multiboot /boot/pcos.elf
    module /boot/pcfs.tar pcfs
    boot
}
